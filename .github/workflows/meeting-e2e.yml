name: meeting-e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1-5'

permissions:
  contents: read

jobs:
  web-e2e:
    name: Web E2E
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate web E2E env
        run: npm run e2e:validate-env -- web

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run web E2E
        run: npm run e2e:web

  native-e2e:
    name: Native E2E
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 180
    env:
      E2E_NATIVE_CONFIRM: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate native E2E env
        run: npm run e2e:validate-env -- native

      - name: Build TypeScript
        run: npm run build:ts

      - name: Run native E2E
        run: npm run e2e:native
